<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img"
     aria-label="Контрагент сам обирає період у Telegram-боті і цілодобово отримує готовий акт звірки у PDF.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="1" stop-color="#e3ecf7"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2740" flood-opacity=".10"/>
    </filter>
    <filter id="sh-s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2740" flood-opacity=".09"/>
    </filter>
    <clipPath id="screen">
      <rect x="237" y="64" width="376" height="622" rx="36"/>
    </clipPath>
  </defs>

  <!-- тло -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="60" cy="700" r="190" fill="#d9e7f5" opacity=".5"/>
  <circle cx="1165" cy="700" r="165" fill="#dbeff2" opacity=".55"/>

  <!-- ===== контрагент ===== -->
  <g filter="url(#sh-s)"><circle cx="108" cy="358" r="56" fill="#ffffff"/></g>
  <circle cx="108" cy="343" r="16" fill="#0b7c8a" opacity=".85"/>
  <path d="M80 388 a 28 26 0 0 1 56 0 Z" fill="#0b7c8a" opacity=".85"/>
  <rect x="44" y="440" width="128" height="22" rx="11" fill="#dbe6f1"/>
  <path d="M170 358 H 206" stroke="#0b7c8a" stroke-width="3.5" opacity=".38" stroke-linecap="round"/>

  <!-- ===== телефон ===== -->
  <g filter="url(#sh)">
    <rect x="215" y="28" width="420" height="694" rx="54" fill="#2b3e59"/>
  </g>
  <rect x="380" y="44" width="90" height="9" rx="4.5" fill="#566b88"/>
  <rect x="237" y="64" width="376" height="622" rx="36" fill="#eef3f8"/>

  <g clip-path="url(#screen)">
    <!-- шапка чату -->
    <rect x="237" y="64" width="376" height="90" fill="#ffffff"/>
    <rect x="237" y="152" width="376" height="2" fill="#e4ecf4"/>
    <circle cx="279" cy="109" r="22" fill="#0b7c8a"/>
    <rect x="268" y="100" width="22" height="18" rx="6" fill="#ffffff"/>
    <circle cx="274" cy="109" r="2.8" fill="#0b7c8a"/>
    <circle cx="284" cy="109" r="2.8" fill="#0b7c8a"/>
    <path d="M279 100 V 93" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="313" y="97" width="122" height="12" rx="6" fill="#cfdbe8"/>
    <rect x="313" y="117" width="76" height="9" rx="4.5" fill="#dfe8f1"/>

    <!-- запит контрагента -->
    <rect x="371" y="192" width="216" height="76" rx="22" fill="#e6f4f6"/>
    <rect x="395" y="215" width="156" height="11" rx="5.5" fill="#8cc6ce"/>
    <rect x="395" y="238" width="104" height="10" rx="5" fill="#b5dbe0"/>

    <!-- бот пропонує обрати період -->
    <g filter="url(#sh-s)">
      <rect x="263" y="292" width="300" height="168" rx="22" fill="#ffffff"/>
    </g>
    <rect x="287" y="320" width="176" height="11" rx="5.5" fill="#dde6ef"/>

    <rect x="287" y="348" width="124" height="46" rx="12" fill="#e6f4f6"/>
    <rect x="301" y="361" width="20" height="20" rx="4" fill="none" stroke="#0b7c8a" stroke-width="2.4"/>
    <path d="M301 367 H 321" stroke="#0b7c8a" stroke-width="2.4"/>
    <rect x="333" y="366" width="62" height="10" rx="5" fill="#8cc6ce"/>

    <rect x="423" y="348" width="124" height="46" rx="12" fill="#e6f4f6"/>
    <rect x="437" y="361" width="20" height="20" rx="4" fill="none" stroke="#0b7c8a" stroke-width="2.4"/>
    <path d="M437 367 H 457" stroke="#0b7c8a" stroke-width="2.4"/>
    <rect x="469" y="366" width="62" height="10" rx="5" fill="#8cc6ce"/>

    <rect x="287" y="410" width="256" height="38" rx="13" fill="#0b7c8a"/>
    <rect x="367" y="423" width="96" height="12" rx="6" fill="#ffffff" opacity=".9"/>

    <!-- бот повертає готовий PDF -->
    <g filter="url(#sh-s)">
      <rect x="263" y="500" width="300" height="112" rx="22" fill="#ffffff"/>
    </g>
    <rect x="287" y="522" width="50" height="66" rx="8" fill="#e6f4f6" stroke="#0b7c8a" stroke-width="2.5"/>
    <rect x="298" y="539" width="28" height="6" rx="3" fill="#0b7c8a" opacity=".55"/>
    <rect x="298" y="553" width="28" height="6" rx="3" fill="#0b7c8a" opacity=".35"/>
    <rect x="298" y="567" width="18" height="6" rx="3" fill="#0b7c8a" opacity=".35"/>
    <rect x="355" y="534" width="158" height="12" rx="6" fill="#cfdbe8"/>
    <rect x="355" y="558" width="100" height="10" rx="5" fill="#dfe8f1"/>

    <rect x="501" y="634" width="62" height="11" rx="5.5" fill="#d3dfeb"/>
  </g>

  <!-- ===== акт іде до контрагента ===== -->
  <path d="M652 545 H 694" stroke="#0b7c8a" stroke-width="5" stroke-linecap="round"/>
  <path d="M694 536 L 710 545 L 694 554 Z" fill="#0b7c8a"/>

  <!-- ===== готовий акт звірки ===== -->
  <g filter="url(#sh)">
    <rect x="726" y="108" width="400" height="534" rx="20" fill="#ffffff"/>
  </g>
  <rect x="762" y="150" width="88" height="36" rx="10" fill="#e6f4f6"/>
  <text x="776" y="176" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="21" font-weight="700" fill="#086673">PDF</text>

  <rect x="762" y="214" width="240" height="16" rx="8" fill="#cfdbe8"/>
  <rect x="762" y="244" width="168" height="12" rx="6" fill="#dfe8f1"/>

  <rect x="762" y="288" width="328" height="32" rx="8" fill="#e6f4f6"/>

  <g fill="#dfe8f1">
    <rect x="762" y="344" width="144" height="12" rx="6"/>
    <rect x="762" y="388" width="126" height="12" rx="6"/>
    <rect x="762" y="432" width="150" height="12" rx="6"/>
    <rect x="762" y="476" width="120" height="12" rx="6"/>
    <rect x="762" y="520" width="138" height="12" rx="6"/>
  </g>
  <g fill="#e4edf5">
    <rect x="930" y="344" width="68" height="12" rx="6"/>
    <rect x="1022" y="344" width="68" height="12" rx="6"/>
    <rect x="930" y="388" width="68" height="12" rx="6"/>
    <rect x="1022" y="388" width="68" height="12" rx="6"/>
    <rect x="930" y="432" width="68" height="12" rx="6"/>
    <rect x="1022" y="432" width="68" height="12" rx="6"/>
    <rect x="930" y="476" width="68" height="12" rx="6"/>
    <rect x="1022" y="476" width="68" height="12" rx="6"/>
    <rect x="930" y="520" width="68" height="12" rx="6"/>
    <rect x="1022" y="520" width="68" height="12" rx="6"/>
  </g>

  <rect x="762" y="572" width="116" height="15" rx="7.5" fill="#a9d3d9"/>
  <rect x="974" y="572" width="116" height="15" rx="7.5" fill="#0b7c8a"/>

  <!-- цілодобово -->
  <g filter="url(#sh-s)"><circle cx="1126" cy="148" r="44" fill="#0b7c8a"/></g>
  <circle cx="1126" cy="148" r="22" fill="none" stroke="#ffffff" stroke-width="3.4"/>
  <path d="M1126 148 V 132 M 1126 148 H 1138" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round"/>
</svg>
