  <path d="M147 624 l 14 14 M161 624 l -14 14" stroke="#c2535a" stroke-width="3" stroke-linecap="round"/>
  <text x="182" y="638" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="400" fill="#41506b" text-anchor="start">Від’ємні вільні залишки в обліку</text>
  <rect x="540" y="640" width="42" height="8" rx="4" fill="#e4edf5"/>
  <path d="M594 642 l 4.0 4.0 l 8.8 -9.600000000000001" fill="none" stroke="#0b7c8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M603 642 l 4.0 4.0 l 8.8 -9.600000000000001" fill="none" stroke="#0b7c8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#sh)"><rect x="712" y="502" width="598" height="170" rx="18" fill="#ffffff"/></g>
  <rect x="742" y="534" width="5" height="106" rx="2.5" fill="#0b7c8a"/>
  <text x="766" y="564" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#1b2740" text-anchor="start">Нове замовлення з сайту</text>
  <text x="766" y="604" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="400" fill="#41506b" text-anchor="start">№ АА0000010 від 20.08.2025</text>
  <text x="766" y="638" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="400" fill="#41506b" text-anchor="start">на суму 1 000,00 грн</text>
  <rect x="1162" y="640" width="42" height="8" rx="4" fill="#e4edf5"/>
  <path d="M1216 642 l 4.0 4.0 l 8.8 -9.600000000000001" fill="none" stroke="#0b7c8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1225 642 l 4.0 4.0 l 8.8 -9.600000000000001" fill="none" stroke="#0b7c8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="722" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="23" font-weight="400" fill="#58657e" text-anchor="start">Розсилка за розкладом або за подією в базі — обидва режими без програмування під кожен випадок.</text>
