  <text x="144" y="408" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="400" fill="#41506b" text-anchor="start">Банк — 1 000 000 грн</text>
  <text x="144" y="442" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="400" fill="#41506b" text-anchor="start">Каса — 100 грн</text>
  <rect x="540" y="444" width="42" height="8" rx="4" fill="#e4edf5"/>
  <path d="M594 446 l 4.0 4.0 l 8.8 -9.600000000000001" fill="none" stroke="#0b7c8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
