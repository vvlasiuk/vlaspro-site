<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" width="1400" height="788" role="img"
     aria-label="Приклади повідомлень бота: звіт «Грошові кошти», прострочена заборгованість, стан інформаційної бази, нове замовлення з сайту.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="1" stop-color="#e3ecf7"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2740" flood-opacity=".10"/>
    </filter>
    <filter id="sh-s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2740" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <circle cx="1340" cy="740" r="190" fill="#d9e7f5" opacity=".45"/>
