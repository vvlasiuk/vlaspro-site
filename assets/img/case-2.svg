<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img"
     aria-label="Заявка на платіж приходить у Telegram з кнопками «Погодити» і «Відхилити», рішення повертається в облікову базу, запит бачать кілька відповідальних осіб.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="1" stop-color="#e3ecf7"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2740" flood-opacity=".10"/>
    </filter>
    <filter id="sh-s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2740" flood-opacity=".09"/>
    </filter>
    <clipPath id="screen">
      <rect x="382" y="76" width="376" height="598" rx="36"/>
    </clipPath>
  </defs>

  <!-- тло -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="90" cy="690" r="200" fill="#d9e7f5" opacity=".5"/>
  <circle cx="1140" cy="60" r="175" fill="#dbeff2" opacity=".6"/>

  <!-- ===== облікова база: заявка ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="255" width="230" height="240" rx="22" fill="#ffffff"/>
  </g>
  <g>
    <rect x="72" y="285" width="62" height="78" rx="10" fill="#e6f4f6" stroke="#0b7c8a" stroke-width="3"/>
    <rect x="84" y="303" width="38" height="7" rx="3.5" fill="#0b7c8a" opacity=".55"/>
    <rect x="84" y="319" width="38" height="7" rx="3.5" fill="#0b7c8a" opacity=".35"/>
    <rect x="84" y="335" width="24" height="7" rx="3.5" fill="#0b7c8a" opacity=".35"/>
    <rect x="152" y="300" width="96" height="12" rx="6" fill="#cfdbe8"/>
    <rect x="152" y="324" width="72" height="12" rx="6" fill="#dfe8f1"/>
    <rect x="72" y="392" width="166" height="12" rx="6" fill="#dfe8f1"/>
    <rect x="72" y="416" width="130" height="12" rx="6" fill="#dfe8f1"/>
    <rect x="72" y="446" width="138" height="34" rx="17" fill="#e6f4f6"/>
    <text x="88" y="469" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="19" font-weight="700" fill="#086673">25 000 грн</text>
  </g>

  <!-- ===== обмін: запит туди, рішення назад ===== -->
  <g stroke="#0b7c8a" fill="none" stroke-linecap="round">
    <path d="M286 330 H 338" stroke-width="5"/>
    <path d="M340 440 H 292" stroke-width="4" opacity=".55" stroke-dasharray="9 9"/>
  </g>
  <path d="M338 321 L 354 330 L 338 339 Z" fill="#0b7c8a"/>
  <path d="M292 431 L 276 440 L 292 449 Z" fill="#0b7c8a" opacity=".55"/>

  <!-- ===== телефон ===== -->
  <g filter="url(#sh)">
    <rect x="360" y="40" width="420" height="670" rx="54" fill="#2b3e59"/>
  </g>
  <rect x="525" y="56" width="90" height="9" rx="4.5" fill="#566b88"/>
  <rect x="382" y="76" width="376" height="598" rx="36" fill="#eef3f8"/>

  <g clip-path="url(#screen)">
    <!-- шапка чату -->
    <rect x="382" y="76" width="376" height="86" fill="#ffffff"/>
    <rect x="382" y="160" width="376" height="2" fill="#e4ecf4"/>
    <circle cx="424" cy="120" r="22" fill="#0b7c8a"/>
    <rect x="413" y="111" width="22" height="18" rx="6" fill="#ffffff"/>
    <circle cx="419" cy="120" r="2.8" fill="#0b7c8a"/>
    <circle cx="429" cy="120" r="2.8" fill="#0b7c8a"/>
    <path d="M424 111 V 104" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="458" y="108" width="122" height="12" rx="6" fill="#cfdbe8"/>
    <rect x="458" y="128" width="76" height="9" rx="4.5" fill="#dfe8f1"/>

    <!-- повідомлення із заявкою -->
    <g filter="url(#sh-s)">
      <rect x="404" y="196" width="332" height="326" rx="24" fill="#ffffff"/>
    </g>
    <text x="432" y="240" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="27" font-weight="700" fill="#41506b">Заявка на платіж</text>
    <text x="432" y="292" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="40" font-weight="800" fill="#0b7c8a">25 000 грн</text>
    <rect x="432" y="316" width="240" height="11" rx="5.5" fill="#e0e8f1"/>
    <rect x="432" y="338" width="170" height="11" rx="5.5" fill="#e0e8f1"/>

    <rect x="432" y="370" width="276" height="58" rx="16" fill="#0b7c8a"/>
    <path d="M478 399 l 9 9 l 17 -18" stroke="#ffffff" stroke-width="4.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="518" y="407" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="25" font-weight="700" fill="#ffffff">Погодити</text>

    <rect x="432" y="442" width="276" height="58" rx="16" fill="#ffffff" stroke="#e9c3c3" stroke-width="2"/>
    <path d="M478 463 l 18 18 M 496 463 l -18 18" stroke="#c2535a" stroke-width="4.5"
          stroke-linecap="round"/>
    <text x="518" y="479" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="25" font-weight="700" fill="#c2535a">Відхилити</text>

    <!-- відповідь: рішення зафіксоване в базі -->
    <rect x="496" y="556" width="240" height="66" rx="22" fill="#e6f4f6"/>
    <circle cx="530" cy="589" r="17" fill="#0b7c8a"/>
    <path d="M523 589 l 5 5 l 10 -11" stroke="#ffffff" stroke-width="3.4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="560" y="578" width="146" height="11" rx="5.5" fill="#8cc6ce"/>
    <rect x="560" y="598" width="98" height="10" rx="5" fill="#b5dbe0"/>
  </g>

  <!-- ===== відповідальні особи ===== -->
  <g stroke="#0b7c8a" stroke-width="3.5" fill="none" opacity=".38">
    <path d="M790 340 C 850 300, 872 228, 926 196"/>
    <path d="M790 375 H 926"/>
    <path d="M790 410 C 850 450, 872 522, 926 554"/>
  </g>

  <g>
    <g filter="url(#sh-s)"><circle cx="980" cy="185" r="50" fill="#ffffff"/></g>
    <circle cx="980" cy="172" r="14" fill="#0b7c8a" opacity=".85"/>
    <path d="M956 212 a 24 22 0 0 1 48 0 Z" fill="#0b7c8a" opacity=".85"/>
    <circle cx="1016" cy="150" r="17" fill="#0b7c8a"/>
    <path d="M1009 150 l 5 5 l 9 -10" stroke="#ffffff" stroke-width="3.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1042" y="174" width="112" height="22" rx="11" fill="#dbe6f1"/>

    <g filter="url(#sh-s)"><circle cx="980" cy="375" r="50" fill="#ffffff"/></g>
    <circle cx="980" cy="362" r="14" fill="#0b7c8a" opacity=".6"/>
    <path d="M956 402 a 24 22 0 0 1 48 0 Z" fill="#0b7c8a" opacity=".6"/>
    <rect x="1042" y="364" width="112" height="22" rx="11" fill="#dbe6f1"/>

    <g filter="url(#sh-s)"><circle cx="980" cy="565" r="50" fill="#ffffff"/></g>
    <circle cx="980" cy="552" r="14" fill="#0b7c8a" opacity=".6"/>
    <path d="M956 592 a 24 22 0 0 1 48 0 Z" fill="#0b7c8a" opacity=".6"/>
    <rect x="1042" y="554" width="112" height="22" rx="11" fill="#dbe6f1"/>
  </g>
</svg>
